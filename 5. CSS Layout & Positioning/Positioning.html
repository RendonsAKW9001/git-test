<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <style>
        /* .static {
            position: static;
        } */

        /* Relative useful for positioning elements relative to their normal position */
        .relative {
            position: relative;
            /* top: 20px; */
            left: 30px;
        }

        .parent {
            position: relative;
            width: 300px;
            height: 1000px;
            background-color: lightgray;
        }

        /* Absolute useful for positioning elements within a relative parent */
        .absolute {
            position: absolute;
            top: 50px;
            left: 100px;
            background-color: lightcoral;
        }

        /* Fixed useful for chatbots */
        .fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: yellow;
        }

        /* Sticky useful for navigation bars */
        .sticky {
            position: sticky;
            top: 0;
            background-color: lightgreen;
            z-index: 1000;
        }

        .box {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        .one {
            background-color: red;
            z-index: 1;
        }

        .two {
            background-color: blue;
            z-index: 2;
            top: 20px;
            left: 20px;
        }
    </style>
</head>

<body>
    <!-- <header class="sticky">I am sticky</header>
    <p class="static">I am static.</p>
    <div class="relative">I am relative</div>
    <div class="fixed">I am fixed</div>

    <div class="parent">
        <div class="absolute">I am absolute</div>
    </div> -->
    <div class="box one">box one</div>
    <div class="box two">box two( above )</div>
</body>

</html>
