<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing font size</title>
    <style>
        /* em - Relative to parent element 1em = 100% */
        /* rem - Relative to the root ( html { font-size : 16px ) 1rem = 16px */
        /* vw, vh -> Relative to viewport width and height */
        .small {
            font-size: 12px;
        }

        .medium {
            font-size: 18px;
        }

        .large {
            font-size: 24px;
        }

        .relative {
            font-size: 1.5em;
        }

        .viewport {
            font-size: 5vw;
        }
    </style>
</head>

<body>
    <!-- <p class="small">This is small font</p>
    <p class="medium">this is medium font</p>
    <p class="large">this is large font</p> -->
    <p class="relative">this is relative size</p>
    <p class="viewport">this is viewport size</p>
</body>

</html>
