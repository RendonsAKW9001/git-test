<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments and Console Log</title>
</head>

<body>
    <script>
        // this is a comment

        /**
          * 
          * this is a multiline
          * comment
          * */

        // console.logging for debugging
        // console.log() - displays output in the browser console
        // console.warn() - shows warning message
        // console.error() - displays error message

        // this is a single line comment
        console.log("This is a log message in the console");

        /*
            this is a multi-line comment
            it is ignored by JavaScript
        */

        console.warn("this is aa warning!")
        console.error("this is an error!")
    </script>
</body>

</html>
